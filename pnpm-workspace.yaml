# pnpm 11 reads build-script approval from this file, not from package.json
# (`pnpm.onlyBuiltDependencies` there is warned about and ignored). esbuild's
# postinstall is what makes vitest and tsdown usable, so approve exactly that
# one rather than running every dependency's install script.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.2.2-rc.2'
  - '@deepseek-ai/dsh-brand@0.2.2-rc.2'
  - '@deepseek-ai/dsh-client-locale@0.2.2-rc.2'
  - '@deepseek-ai/dsh-client-ui-settings@0.2.2-rc.2'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.2-rc.2'
  - '@deepseek-ai/dsh-error@0.2.2-rc.2'
  - '@deepseek-ai/dsh-host-webserver@0.2.2-rc.2'
  - '@deepseek-ai/dsh-llm@0.2.2-rc.2'
  - '@deepseek-ai/dsh-scope@0.2.2-rc.2'
  - '@deepseek-ai/dsh-session-projection@0.2.2-rc.2'
  - '@deepseek-ai/dsh-session-title-llm@0.2.2-rc.2'
  - '@deepseek-ai/dsh-session-title@0.2.2-rc.2'
  - '@deepseek-ai/dsh-session@0.2.2-rc.2'
  - '@deepseek-ai/dsh-system-prompt@0.2.2-rc.2'
  - '@deepseek-ai/dsh-timeout@0.2.2-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.2.2-rc.2'
  - '@deepseek-ai/dsh-util-crypto@0.2.2-rc.2'
  - '@deepseek-ai/dsh-util-values@0.2.2-rc.2'
