name: Feature request
description: Propose a change or addition to dsh-session-title
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the solution. Requests that explain a real use
        case are far more likely to be implemented. One request per issue, please.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and discussions and did not find a duplicate.
          required: true
        - label: This request is about this project, not about a third-party dependency.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do, and what blocks you today?
      placeholder: "I want to ... but currently I have to ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like the plugin to do. Sketch the UI, the command, or the API shape if it helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other designs you rejected and why.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mock-ups, links, or related issues. Redact secrets and personal data.
    validations:
      required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
